<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หารค่าข้าว — Food Expense Splitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f0e6; --card:#fffdf8; --ink:#1f1b16; --muted:#71695d; --line:#e3dacb; --soft:#efe8da;
  --accent:#c2410c; --accent-ink:#fff; --accent-soft:#fbe6d9;
  --get:#25744a; --get-soft:#dcefe3; --pay:#b42318; --pay-soft:#f8e0dd; --warn:#a15c00; --warn-soft:#fbefd6;
  --r:14px; --shadow:0 1px 0 rgba(31,27,22,.04),0 6px 18px -10px rgba(31,27,22,.25);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#15120e; --card:#1f1b16; --ink:#f2ece1; --muted:#a59c8e; --line:#352f27; --soft:#29241d;
  --accent:#f0743a; --accent-ink:#1a1009; --accent-soft:#3a2416;
  --get:#5cc489; --get-soft:#163324; --pay:#f2776a; --pay-soft:#3a1a16; --warn:#f0b54d; --warn-soft:#352812;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;padding-bottom:84px}
.num,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{padding:22px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.title-in{font:700 26px/1.25 "IBM Plex Sans Thai",sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed transparent;width:100%;padding:2px 0;margin:2px 0 0}
.title-in:hover,.title-in:focus{border-bottom-color:var(--line);outline:none}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:120px;flex:1}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:12.5px;color:var(--muted)}
section.block{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h2{font-size:18px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
input,select,textarea,button{font:inherit;color:inherit}
.in{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px}
.in.invalid{border-color:var(--pay);background:var(--pay-soft)}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--card)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:0 0 4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;min-height:42px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--soft)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn.icon{width:38px;min-height:38px;padding:0}
.btn.danger:hover{color:var(--pay);border-color:var(--pay)}
/* members */
.members{padding:12px}
.mrow{display:grid;grid-template-columns:28px 1fr 1fr 38px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.mrow:last-of-type{border-bottom:0}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.addm{display:flex;gap:8px;margin-top:10px}
.mhead{display:grid;grid-template-columns:28px 1fr 1fr 38px;gap:8px;font-size:12px;color:var(--muted);font-weight:600;padding:0 0 4px}
/* items */
.items{display:flex;flex-direction:column;gap:12px}
.item{padding:14px}
.item.bad{border-color:var(--warn)}
.ifields{display:grid;gap:10px;align-items:end;grid-template-columns:150px 1fr 38px;grid-template-areas:"cat name del" "total payer payer"}
.f-cat{grid-area:cat}.f-name{grid-area:name;min-width:0}.f-total{grid-area:total}.f-payer{grid-area:payer;min-width:0}.f-del{grid-area:del}
@media (min-width:820px){.ifields{grid-template-columns:130px minmax(0,1fr) 130px 190px 38px;grid-template-areas:"cat name total payer del"}}
.parts-h{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;user-select:none;background:var(--paper);font-weight:500;min-height:36px;transition:background .12s,border-color .12s}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.chip.on{background:var(--accent-soft);border-color:var(--accent)}
.chip.on .box{background:var(--accent);border-color:var(--accent)}
.chip.on .box::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chip:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.ifoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);gap:10px;flex-wrap:wrap}
.share{font-size:14px;color:var(--muted)}
.share b{color:var(--ink);font-size:17px}
.warnmsg{color:var(--warn);font-weight:600;font-size:13.5px}
.multi{margin-top:10px;background:var(--soft);border-radius:10px;padding:10px}
.multi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.multi-grid .mi{display:flex;align-items:center;gap:6px}
.multi-grid .mi span{flex:none;min-width:48px;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.multi-grid .in{min-height:36px;padding:6px 9px}
.multi-sum{font-size:13px;margin-top:8px}
.add-item{margin-top:12px;width:100%;border-style:dashed;min-height:52px;font-size:15px}
/* summary */
.sumtable{width:100%;border-collapse:collapse}
.sumtable th{font-size:12px;color:var(--muted);text-align:right;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
.sumtable th:first-child{text-align:left}
.sumtable td{padding:11px 12px;border-bottom:1px dashed var(--line);text-align:right}
.sumtable td:first-child{text-align:left}
.sumtable tr.p{cursor:pointer}
.sumtable tr.p:hover td{background:var(--soft)}
.sumtable tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:8px;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.get{background:var(--get-soft);color:var(--get)}
.pill.pay{background:var(--pay-soft);color:var(--pay)}
.pill.even{background:var(--soft);color:var(--muted)}
.pos{color:var(--get)} .neg{color:var(--pay)}
.detail td{background:var(--soft);font-size:13.5px;text-align:left!important}
.detail ul{margin:0;padding:0;list-style:none}
.detail li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.caret{display:inline-block;transition:transform .15s;color:var(--muted);font-size:11px}
tr.open .caret{transform:rotate(90deg)}
.transfers{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tx{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:12px 14px}
.tx .path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.tx .arrow{color:var(--muted)}
.tx .amt{font-size:18px;font-weight:600}
.empty{padding:28px 18px;text-align:center}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{margin:0 0 16px;color:var(--muted)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cats{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
.cat{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13.5px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
/* bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20}
.bottombar .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.bottombar .tot{flex:1;min-width:0}
.bottombar .tot small{display:block;color:var(--muted);font-size:12px}
.bottombar .tot b{font-size:19px}
.nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px}
.nav a:hover{background:var(--soft);color:var(--ink)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,12,9,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal-bg.show{display:flex}
.modal{background:var(--card);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px;max-height:90vh;overflow:auto}
@media (min-width:600px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:18px}}
.modal h3{margin:0 0 6px;font-size:18px}
.modal p{margin:0 0 12px;color:var(--muted);font-size:14px}
.modal textarea{width:100%;min-height:200px;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.qrbox{background:#fff;border-radius:12px;padding:10px;margin:8px auto 10px;max-width:280px}
.qrbox svg{display:block;width:100%;height:auto}
.qr-amt{text-align:center;font-size:26px;font-weight:600}
.qr-sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:12px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* summary page */
body.sp-mode #editor,body.sp-mode .bottombar{display:none}
body.sp-mode{padding-bottom:20px}
#sumPage{display:none}
body.sp-mode #sumPage{display:block}
.sp-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 0 4px;flex-wrap:wrap}
.sp-hero{background:var(--ink);color:var(--paper);border-radius:18px;padding:18px 20px;margin-top:8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sp-hero h1{margin:0;font-size:22px;line-height:1.3}
.sp-hero .meta{opacity:.7;font-size:13px}
.sp-hero .big{font-size:28px;font-weight:600}
.sp-h{font-size:16px;margin:22px 0 8px}
.sp-list{padding:4px 16px}
.sp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.sp-row:last-child{border-bottom:0}
.sp-to{display:grid;grid-template-columns:auto auto auto;align-items:center;justify-items:start;gap:6px 8px}
.sp-tx{display:contents}
.sp-arrow{font-size:18px;line-height:1}
.sp-recv{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;font-weight:600;font-size:14px;background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.sp-recv{min-width:100px}
.sp-recv .avatar{width:24px;height:24px;font-size:12px}
.sp-tx b{min-width:92px;text-align:right}
.sp-to b{font-size:17px}
.sp-qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sp-qr{padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sp-qr .qrbox{width:190px;margin:4px auto 0;padding:8px}
.sp-qr .pp{font-size:13px;color:var(--muted)}
.nopp{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;margin:8px 0}
@media print{body.sp-mode .sp-top{display:none}}
footer.foot{margin:34px 0 10px;color:var(--muted);font-size:12.5px;text-align:center}
@media (max-width:640px){
  .wrap{padding:0 12px}
  .title-in{font-size:22px}
  .ifields{grid-template-columns:1fr 1fr 38px;grid-template-areas:"cat cat del" "name name name" "total payer payer"}
  .mrow,.mhead{grid-template-columns:28px 1fr 1fr 38px;gap:6px}
  .sumtable th,.sumtable td{padding:9px 6px;font-size:13.5px}
  .sumtable .hide-m{display:none}
  .tx{grid-template-columns:1fr auto;}
  .tx .qrbtn{grid-column:1/-1}
  .nav{display:none}
  .hide-sm{display:none}
  .cat{grid-template-columns:90px 1fr 80px}
}
</style>
</head>
<body>
<div class="wrap" id="sumPage"></div>
<div class="wrap" id="editor">
  <header class="top">
    <div class="eyebrow">ระบบหารค่าอาหาร · Food Expense Splitter</div>
    <input class="title-in" id="title" placeholder="ตั้งชื่อทริป / มื้อนี้" aria-label="ชื่อทริป">
    <div class="stats">
      <div class="stat"><span>ยอดรวมทั้งหมด</span><b class="num" id="stTotal">฿0</b></div>
      <div class="stat"><span>จำนวนคน</span><b class="num" id="stPeople">0</b></div>
      <div class="stat"><span>จำนวนรายการ</span><b class="num" id="stItems">0</b></div>
    </div>
  </header>

  <div id="app"></div>

  <footer class="foot">ข้อมูลบันทึกอัตโนมัติในเบราว์เซอร์เครื่องนี้ · กด “สำรองข้อมูล” เพื่อย้ายไปเครื่องอื่น</footer>
</div>

<div class="bottombar">
  <div class="wrap">
    <div class="tot"><small id="bbSub">ยอดรวม</small><b class="num" id="bbTotal">฿0</b></div>
    <nav class="nav"><a href="#members">สมาชิก</a><a href="#items">รายการ</a></nav>
    <a class="btn hide-sm" href="#summary" style="text-decoration:none;color:inherit">สรุป</a>
    <a class="btn primary" href="#summary-page" style="text-decoration:none">หน้าสรุป →</a>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const KEY='food-splitter-v1';
const COLORS=['#c2410c','#2563eb','#15803d','#9333ea','#db2777','#0d9488','#b45309','#4f46e5','#dc2626','#0891b2','#65a30d','#7c3aed'];
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
let S=null;
const openRows=new Set();

function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k];
    if(v==null||v===false) continue;
    if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='class') el.className=v;
    else if(k==='value') el.value=v;
    else if(k==='checked') el.checked=v;
    else if(k==='selected') el.selected=v;
    else if(k==='text') el.textContent=v;
    else el.setAttribute(k,v===true?'':v);
  }
  kids.flat(9).forEach(c=>{ if(c==null||c===false) return; el.append(c.nodeType?c:String(c)); });
  return el;
}
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
function fmt(n){ n=r2(n); const whole=Math.abs(n%1)<0.001; return n.toLocaleString('th-TH',{minimumFractionDigits:whole?0:2,maximumFractionDigits:2}); }
const baht=n=>'฿'+fmt(n);
const num=v=>{ const x=parseFloat(String(v??'').replace(/,/g,'')); return isFinite(x)?x:0; };
const mById=id=>S.members.find(m=>m.id===id);
const mName=id=>{const m=mById(id); return m?(m.name||'(ไม่มีชื่อ)'):'?';};
const mColor=id=>{const i=S.members.findIndex(m=>m.id===id); return COLORS[(i<0?0:i)%COLORS.length];};
const avatar=id=>h('span',{class:'avatar',style:'background:'+mColor(id),'data-av':id},(mName(id)||'?').trim().charAt(0)||'?');

/* ---------- storage ---------- */
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function load(){ try{const t=localStorage.getItem(KEY); if(t){const o=JSON.parse(t); if(o&&Array.isArray(o.members)) return o;}}catch(e){} return null; }
function blank(){ return {title:'',members:[],items:[]}; }
function sample(){
  const names=['คีม','ตุ้ย','ไอซ์','อ๋อง','ไป๋','มอส','นัท'];
  const ms=names.map(n=>({id:uid(),name:n,pp:''}));
  const id=n=>ms[names.indexOf(n)].id;
  const all=ms.map(m=>m.id);
  const ex=(...x)=>all.filter(i=>!x.map(id).includes(i));
  const only=(...x)=>x.map(id);
  const it=(cat,name,payer,total,parts)=>({id:uid(),cat,name,payer:id(payer),multi:false,payers:{},total:String(total),parts});
  return {title:'ทริปเพื่อน (ตัวอย่าง)',members:ms,items:[
    it('เหล้า','รี 4 แบน','คีม',1360,ex('นัท')),
    it('บันเทิง','บันเทิง','คีม',18000,all.slice()),
    it('อาหาร','โลตัส','ตุ้ย',3791,all.slice()),
    it('อาหาร','แมคโคร','ตุ้ย',2348,all.slice()),
    it('กาแฟ','ค่าบริการ','คีม',200,only('คีม','ตุ้ย','ไอซ์')),
    it('ค่าที่พัก','ที่พักและน้ำแข็ง','ไอซ์',3245,all.slice()),
    it('อาหาร','ค่าข้าวเที่ยง','คีม',790,ex('นัท')),
    it('อาหาร','ค่าข้าวเที่ยงวันกลับ','คีม',420,ex('มอส')),
    it('เครื่องดื่ม','น้ำแข็ง','คีม',130,all.slice()),
    it('ค่าน้ำมันรถ','ค่าน้ำมันรถ','ตุ้ย','',only('คีม','ตุ้ย','ไอซ์')),
  ]};
}
function newItem(){ return {id:uid(),cat:'อาหาร',name:'',payer:'',multi:false,payers:{},total:'',parts:S.members.map(m=>m.id)}; }

/* ---------- compute ---------- */
function compute(){
  const ids=S.members.map(m=>m.id);
  const cons={},paid={},lines={};
  ids.forEach(i=>{cons[i]=0;paid[i]=0;lines[i]=[];});
  const st={}; let total=0, valid=0; const cats={};
  for(const it of S.items){
    const t=num(it.total);
    const parts=it.parts.filter(i=>ids.includes(i));
    let s={ok:false,n:parts.length,share:parts.length?t/parts.length:0};
    if(t<=0){ s.msg=it.name||it.cat?'ยังไม่ได้ใส่ราคา':''; s.kind='empty'; }
    else if(!parts.length){ s.msg='ยังไม่ได้เลือกคนหาร'; s.kind='warn'; }
    else if(it.multi){
      const sum=ids.reduce((a,i)=>a+num(it.payers[i]),0);
      if(Math.abs(sum-t)>0.009){ s.msg=`ยอดที่แต่ละคนจ่าย (${fmt(sum)}) ไม่เท่ากับราคารวม (${fmt(t)})`; s.kind='warn'; s.sum=sum; }
      else s.ok=true;
      s.sum=sum;
    } else if(!ids.includes(it.payer)){ s.msg='ยังไม่ได้เลือกคนจ่ายเงิน'; s.kind='warn'; }
    else s.ok=true;
    if(s.ok){
      valid++; total+=t;
      const label=it.name||it.cat||'รายการ';
      cats[it.cat||'อื่นๆ']=(cats[it.cat||'อื่นๆ']||0)+t;
      parts.forEach(i=>{cons[i]+=s.share; lines[i].push({label,amt:s.share,type:'eat'});});
      if(it.multi) ids.forEach(i=>{const a=num(it.payers[i]); if(a>0){paid[i]+=a; lines[i].push({label,amt:a,type:'paid'});}});
      else { paid[it.payer]+=t; lines[it.payer].push({label,amt:t,type:'paid'}); }
    }
    st[it.id]=s;
  }
  const net={}; ids.forEach(i=>net[i]=paid[i]-cons[i]);
  return {cons,paid,net,lines,st,total,valid,cats,tx:settle(net)};
}
function settle(net){
  const cred=[],debt=[];
  for(const id in net){ const v=r2(net[id]); if(v>0.005) cred.push({id,a:v}); else if(v<-0.005) debt.push({id,a:-v}); }
  cred.sort((a,b)=>b.a-a.a); debt.sort((a,b)=>b.a-a.a);
  const out=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const x=r2(Math.min(debt[i].a,cred[j].a));
    if(x>0.004) out.push({from:debt[i].id,to:cred[j].id,amt:x});
    debt[i].a=r2(debt[i].a-x); cred[j].a=r2(cred[j].a-x);
    if(debt[i].a<=0.004) i++;
    if(cred[j].a<=0.004) j++;
  }
  return out;
}

/* ---------- render ---------- */
function renderAll(){
  $('#title').value=S.title||'';
  const app=$('#app'); app.innerHTML='';
  if(!S.members.length && !S.items.length){ app.append(renderEmpty()); }
  app.append(renderMembers(), renderItems(), h('section',{class:'block',id:'summary'}));
  refresh();
}
function renderEmpty(){
  return h('div',{class:'card empty',style:'margin-top:18px'},
    h('h3',{},'เริ่มหารค่าข้าวกันเลย'),
    h('p',{},'เพิ่มชื่อเพื่อนด้านล่าง แล้วใส่รายการที่จ่ายไป ระบบจะคิดให้ว่าใครต้องโอนให้ใครเท่าไหร่'),
    h('div',{style:'display:flex;gap:8px;justify-content:center;flex-wrap:wrap'},
      h('button',{class:'btn',onclick:()=>{S=sample();save();renderAll();toast('โหลดข้อมูลตัวอย่างแล้ว');}},'ลองดูข้อมูลตัวอย่าง'),
      h('button',{class:'btn primary',onclick:()=>{document.querySelector('#newMember')?.focus();}},'+ เพิ่มชื่อเพื่อน'))
  );
}
/* PromptPay input: digits only, max 15 (phone 10 / ID 13 / e-wallet 15) */
function ppIn(m){
  const clean=v=>String(v||'').replace(/[๐-๙]/g,c=>String(c.charCodeAt(0)-0x0E50)).replace(/\D/g,'').slice(0,15);
  const el=h('input',{class:'in mono',type:'text',inputmode:'numeric',pattern:'[0-9]*',maxlength:'15',autocomplete:'off',enterkeyhint:'done',placeholder:'เบอร์ / เลขบัตร',value:clean(m.pp),'aria-label':'PromptPay ของ '+m.name});
  const mark=()=>el.classList.toggle('invalid',!!el.value&&!ppTarget(el.value));
  el.addEventListener('keydown',e=>{ if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!/[\d๐-๙]/.test(e.key)) e.preventDefault(); });
  el.addEventListener('input',()=>{ const c=clean(el.value); if(c!==el.value) el.value=c; el.classList.remove('invalid'); m.pp=c; save(); refresh(); });
  el.addEventListener('blur',mark); mark();
  return el;
}
function renderMembers(){
  const list=h('div',{});
  if(S.members.length) list.append(h('div',{class:'mhead'},h('span'),h('span',{},'ชื่อ'),h('span',{},'PromptPay (ไม่บังคับ)'),h('span')));
  S.members.forEach(m=>{
    list.append(h('div',{class:'mrow'},
      avatar(m.id),
      h('input',{class:'in',value:m.name,placeholder:'ชื่อ','aria-label':'ชื่อ',oninput:e=>{m.name=e.target.value;save();syncNames(m.id);refresh();}}),
      ppIn(m),
      h('button',{class:'btn icon ghost danger',title:'ลบ',onclick:()=>askRemoveMember(m)},'✕')
    ));
  });
  const inp=h('input',{class:'in',id:'newMember',placeholder:'พิมพ์ชื่อเพื่อน แล้วกด Enter (ใส่หลายชื่อคั่นด้วย , ได้)',onkeydown:e=>{if(e.key==='Enter'){e.preventDefault();addMembers(inp);}}});
  return h('section',{class:'block',id:'members'},
    h('div',{class:'sec-h'},h('h2',{},h('span',{class:'step'},'1'),'ใครไปบ้าง'),h('span',{class:'hint'},S.members.length+' คน')),
    h('div',{class:'card members'},list,
      h('div',{class:'addm'},inp,h('button',{class:'btn primary',onclick:()=>addMembers(inp)},'เพิ่ม')))
  );
}
function addMembers(inp){
  const names=inp.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  if(!names.length){inp.focus();return;}
  const wasEmpty=!S.members.length;
  names.forEach(n=>S.members.push({id:uid(),name:n,pp:''}));
  if(wasEmpty) S.items.forEach(it=>{ if(!it.parts.length) it.parts=S.members.map(m=>m.id); });
  save(); renderAll();
  setTimeout(()=>$('#newMember')?.focus(),0);
}
function askRemoveMember(m){
  const used=S.items.filter(it=>it.parts.includes(m.id)||it.payer===m.id||num(it.payers[m.id])>0).length;
  modal(h('div',{},
    h('h3',{},'ลบ “'+(m.name||'ไม่มีชื่อ')+'” ?'),
    h('p',{},used?`คนนี้อยู่ใน ${used} รายการ ถ้าลบจะถูกเอาออกจากทุกรายการ และยอดต่อหัวจะคำนวณใหม่`:'ยังไม่ได้อยู่ในรายการไหน'),
    h('div',{class:'acts'},h('button',{class:'btn',onclick:closeModal},'ยกเลิก'),
      h('button',{class:'btn primary',onclick:()=>{
        S.members=S.members.filter(x=>x.id!==m.id);
        S.items.forEach(it=>{it.parts=it.parts.filter(i=>i!==m.id); if(it.payer===m.id) it.payer=''; delete it.payers[m.id];});
        save(); closeModal(); renderAll();
      }},'ลบ'))
  ));
}
function syncNames(id){
  const n=mName(id);
  document.querySelectorAll('[data-mname="'+id+'"]').forEach(el=>el.textContent=n);
  document.querySelectorAll('[data-av="'+id+'"]').forEach(el=>el.textContent=(n.trim().charAt(0)||'?'));
}
function renderItems(){
  const box=h('div',{class:'items',id:'itemList'});
  S.items.forEach(it=>box.append(renderItem(it)));
  return h('section',{class:'block',id:'items'},
    h('div',{class:'sec-h'},h('h2',{},h('span',{class:'step'},'2'),'จ่ายอะไรไปบ้าง'),h('span',{class:'hint'},'ติ๊กชื่อคนที่ต้องหารรายการนั้น')),
    box,

      if(!S.members.length){toast('เพิ่มชื่อเพื่อนก่อนนะ');$('#newMember')?.focus();return;}
      const it=newItem(); S.items.push(it); save();

}
/* number-only input: digits + one dot, max 2 decimals; numeric keypad on mobile */
function cleanNum(v){
  v=String(v).replace(/[๐-๙]/g,c=>String(c.charCodeAt(0)-0x0E50)).replace(/[^\d.]/g,'');
  const i=v.indexOf('.');
  if(i>=0) v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'').slice(0,2);
  return v;
}
function numIn(val,onv){
  const el=h('input',{class:'in num',type:'text',inputmode:'decimal',pattern:'[0-9]*\\.?[0-9]*',autocomplete:'off',enterkeyhint:'done',placeholder:'0',value:val});
  el.addEventListener('keydown',e=>{ if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!/[\d.๐-๙]/.test(e.key)) e.preventDefault(); });
  el.addEventListener('input',()=>{ const c=cleanNum(el.value); if(c!==el.value){ const p=el.selectionStart-(el.value.length-c.length); el.value=c; try{el.setSelectionRange(p,p);}catch(_){} } onv(c); });
  return el;
}

function replaceItem(it){ const old=document.querySelector('[data-item="'+it.id+'"]'); if(old) old.replaceWith(renderItem(it)); }
let lastDeleted=null;

  lastDeleted={it,idx:-1};
  toast('ลบรายการแล้ว',{label:'เลิกทำ',fn:()=>{ if(!lastDeleted) return; S.items.push(lastDeleted.it); lastDeleted=null; save(); renderAll(); }});
}

/* refresh computed bits without rebuilding inputs */
function refresh(){
  const C=compute();
  $('#stTotal').textContent=baht(C.total);
  $('#stPeople').textContent=S.members.length;
  $('#stItems').textContent=C.valid;
  $('#bbTotal').textContent=baht(C.total);
  $('#bbSub').textContent=S.members.length?`ยอดรวม · ${S.members.length} คน · ${C.tx.length} รายการโอน`:'ยอดรวม';
  S.items.forEach(it=>{
    const s=C.st[it.id]; const f=document.querySelector('[data-ifoot="'+it.id+'"]'); const card=document.querySelector('[data-item="'+it.id+'"]');
    if(!f) return;
    card.classList.toggle('bad',s.kind==='warn');
    f.innerHTML='';
    if(s.ok) f.append(h('div',{class:'share'},`หาร ${s.n} คน · คนละ `,h('b',{class:'num'},baht(s.share))));
    else if(s.msg) f.append(h('div',{class:s.kind==='warn'?'warnmsg':'share'},(s.kind==='warn'?'⚠ ':'')+s.msg));
    else f.append(h('div',{class:'share'},'ใส่ราคาและคนจ่ายเงิน'));
    const ms=document.querySelector('[data-msum="'+it.id+'"]');
    if(ms){ const diff=r2(num(it.total)-(s.sum||0)); ms.innerHTML=''; ms.append('รวมที่จ่าย ',h('b',{class:'num'},baht(s.sum||0)),' / ',h('span',{class:'num'},baht(num(it.total))),' ',
      diff===0?h('span',{class:'pos'},'✓ ครบ'):h('span',{class:'neg'},diff>0?`ขาดอีก ${fmt(diff)}`:`เกิน ${fmt(-diff)}`)); }
  });
  renderSummary(C);
}

  }
  sec.append(h('div',{class:'row-actions'},

    h('button',{class:'btn',onclick:()=>copyText(summaryText(C),'คัดลอกสรุปแล้ว ส่งเข้า LINE ได้เลย')},'📋 คัดลอกสรุปส่ง LINE'),

    h('button',{class:'btn danger',onclick:askReset},'เริ่มใหม่')

function summaryText(C){
  const L=[];
  L.push('🧾 '+(S.title||'สรุปค่าใช้จ่าย'));
  L.push(`ยอดรวม ${fmt(C.total)} บาท · ${S.members.length} คน`);
  L.push('');
  L.push('ยอดสุทธิแต่ละคน');
  S.members.forEach(m=>{const n=r2(C.net[m.id]); L.push(`• ${m.name}: กิน ${fmt(C.cons[m.id])} / จ่าย ${fmt(C.paid[m.id])} → ${n>0.005?'รับคืน '+fmt(n):n<-0.005?'โอนออก '+fmt(-n):'เคลียร์แล้ว'}`);});
  L.push('');
  if(C.tx.length){
    L.push('💸 ใครโอนให้ใคร');
    C.tx.forEach(t=>L.push(`• ${mName(t.from)} → ${mName(t.to)} ${fmt(t.amt)} บาท`));
    const recv=[...new Set(C.tx.map(t=>t.to))].map(mById).filter(m=>m&&m.pp&&m.pp.trim());
    if(recv.length){ L.push(''); L.push('PromptPay'); recv.forEach(m=>L.push(`• ${m.name}: ${m.pp.trim()}`)); }
  } else L.push('ทุกคนเคลียร์กันครบแล้ว ✅');
  return L.join('\n');
}

/* ---------- PromptPay QR ---------- */
function ppTarget(raw){
  const d=String(raw||'').replace(/\D/g,'');
  if(d.length===10&&d[0]==='0') return {tag:'01',val:'0066'+d.slice(1),kind:'เบอร์มือถือ'};
  if(d.length===13) return {tag:'02',val:d,kind:'เลขบัตรประชาชน'};
  if(d.length===15) return {tag:'03',val:d,kind:'e-Wallet'};
  return null;
}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?((c<<1)^0x1021):(c<<1); c&=0xFFFF; } return c.toString(16).toUpperCase().padStart(4,'0'); }
function ppPayload(t,amt){
  let p=tlv('00','01')+tlv('01',amt?'12':'11')+tlv('29',tlv('00','A000000677010111')+tlv(t.tag,t.val))+tlv('58','TH')+tlv('53','764');
  if(amt) p+=tlv('54',amt.toFixed(2));
  p+='6304'; return p+crc16(p);
}
function showQR(t){
  const to=mById(t.to);
  const body=h('div',{});
  const draw=()=>{
    body.innerHTML='';
    const tg=ppTarget(to&&to.pp);
    body.append(h('h3',{},`${mName(t.from)} โอนให้ ${mName(t.to)}`));
    if(!tg){
      const inp=h('input',{class:'in mono',inputmode:'numeric',pattern:'[0-9]*',maxlength:'15',oninput:e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,15);},placeholder:'เบอร์มือถือ 10 หลัก หรือเลขบัตร 13 หลัก',value:to?.pp||''});
      body.append(h('p',{},`ใส่ PromptPay ของ ${mName(t.to)} เพื่อสร้าง QR พร้อมยอดเงิน`),inp,
        h('div',{class:'acts'},h('button',{class:'btn',onclick:closeModal},'ปิด'),h('button',{class:'btn primary',onclick:()=>{
          if(!ppTarget(inp.value)){toast('รูปแบบเบอร์/เลขบัตรไม่ถูกต้อง');return;}
          to.pp=inp.value.trim(); save(); renderAll(); draw();
        }},'บันทึก & สร้าง QR')));
      setTimeout(()=>inp.focus(),50); return;
    }
    const qbox=h('div',{class:'qrbox'});
    try{ const q=qrcode(0,'M'); q.addData(ppPayload(tg,t.amt)); q.make(); qbox.innerHTML=q.createSvgTag(6,4); }
    catch(e){ qbox.textContent='สร้าง QR ไม่สำเร็จ'; }
    body.append(qbox,h('div',{class:'qr-amt num'},baht(t.amt)),
      h('div',{class:'qr-sub'},`PromptPay ${tg.kind} · `,h('span',{class:'mono'},to.pp.trim())),
      h('div',{class:'acts'},
        h('button',{class:'btn',onclick:()=>copyText(to.pp.replace(/\D/g,''),'คัดลอกเลขแล้ว')},'คัดลอกเลข'),
        h('button',{class:'btn',onclick:()=>copyText(String(r2(t.amt)),'คัดลอกยอดแล้ว')},'คัดลอกยอด'),
        h('button',{class:'btn primary',onclick:closeModal},'ปิด')));
  };
  draw(); modal(body);
}


function qrNode(tg,amt){
  const box=h('div',{class:'qrbox'});
  try{ const q=qrcode(0,'M'); q.addData(ppPayload(tg,amt)); q.make(); box.innerHTML=q.createSvgTag(6,4); }
  catch(e){ box.textContent='สร้าง QR ไม่สำเร็จ'; }
  return box;
}
function renderSumPage(){
  const C=compute(); const pg=$('#sumPage'); pg.innerHTML='';
  const d=new Date();
  pg.append(
    h('div',{class:'sp-top'},
      h('a',{class:'btn',href:'#items',style:'text-decoration:none;color:inherit'},'← กลับไปแก้ไข'),
      h('button',{class:'btn',onclick:()=>copyText(summaryText(C),'คัดลอกสรุปแล้ว ส่งเข้า LINE ได้เลย')},'📋 คัดลอกข้อความ')),
    h('div',{class:'sp-hero'},
      h('div',{},h('div',{class:'meta'},d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+` · ${S.members.length} คน`),
        h('h1',{},S.title||'สรุปค่าใช้จ่าย')),
      h('div',{style:'text-align:right'},h('div',{class:'meta'},'ยอดรวม'),h('div',{class:'big num'},baht(C.total))))
  );
  if(!S.members.length){ pg.append(h('div',{class:'card empty',style:'margin-top:14px'},h('p',{style:'margin:0'},'ยังไม่มีข้อมูล'))); return; }

  // 1) who pays how much
  const debtors=S.members.filter(m=>r2(C.net[m.id])<-0.005).sort((a,b)=>C.net[a.id]-C.net[b.id]);
  const list=h('div',{class:'card sp-list'});
  if(!debtors.length) list.append(h('div',{class:'sp-row'},h('span',{class:'hint'},'ทุกคนเคลียร์กันครบแล้ว ไม่ต้องโอน 🎉')));
  debtors.forEach(m=>{
    const txs=C.tx.filter(t=>t.from===m.id);
    list.append(h('div',{class:'sp-row'},
      h('div',{class:'who'},avatar(m.id),h('span',{},m.name)),
      h('div',{class:'sp-to'},txs.map(t=>h('div',{class:'sp-tx'},
        h('span',{class:'sp-arrow',style:'color:'+mColor(t.to)},'➜'),
        h('span',{class:'sp-recv',style:`--c:${mColor(t.to)}`},avatar(t.to),h('span',{},mName(t.to))),
        h('b',{class:'num'},baht(t.amt)))))
    ));
  });
  pg.append(h('h2',{class:'sp-h'},'ใครต้องจ่ายเท่าไหร่'),list);

  // 2) one QR per receiver
  const recv=S.members.filter(m=>r2(C.net[m.id])>0.005).sort((a,b)=>C.net[b.id]-C.net[a.id]);
  if(recv.length){
    const grid=h('div',{class:'sp-qrs'});
    recv.forEach(m=>{
      const tg=ppTarget(m.pp);
      grid.append(h('div',{class:'card sp-qr'},
        h('div',{class:'who',style:'justify-content:center'},avatar(m.id),h('span',{style:'font-size:17px'},m.name)),
        tg?qrNode(tg,0):h('div',{class:'nopp'},'ยังไม่ได้ใส่เบอร์ PromptPay'),
        tg?h('div',{class:'mono pp'},m.pp.trim()):null,
        h('div',{class:'hint'},'รับคืนรวม ',h('b',{class:'num pos'},baht(C.net[m.id])))
      ));
    });
    pg.append(h('h2',{class:'sp-h'},'สแกนโอนให้'),grid);
  }
}
function route(){
  const sp=location.hash==='#summary-page';
  document.body.classList.toggle('sp-mode',sp);
  if(sp){ renderSumPage(); window.scrollTo(0,0); }
}
window.addEventListener('hashchange',route);

/* ---------- modal / toast / copy ---------- */
function modal(node){ const m=$('#modal'); m.innerHTML=''; m.append(node); $('#modalBg').classList.add('show'); }
function closeModal(){ $('#modalBg').classList.remove('show'); }
$('#modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
let tt;
function toast(msg,action){
  const t=$('#toast'); t.innerHTML=''; t.append(msg);
  if(action){ t.style.pointerEvents='auto'; t.append(' ',h('button',{class:'btn sm',style:'margin-left:8px;min-height:28px',onclick:()=>{action.fn();t.classList.remove('show');}},action.label)); }
  else t.style.pointerEvents='none';
  t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),action?5000:2200);
}
async function copyText(text,okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg||'คัดลอกแล้ว'); }
  catch(e){
    const ta=h('textarea',{class:'in',readonly:true},text);
    modal(h('div',{},h('h3',{},'คัดลอกข้อความ'),h('p',{},'กดค้างเพื่อเลือกทั้งหมด แล้วคัดลอก'),ta,h('div',{class:'acts'},h('button',{class:'btn primary',onclick:closeModal},'ปิด'))));
    setTimeout(()=>{ta.focus();ta.select();},50);
  }
}
function backupModal(){
  const ta=h('textarea',{class:'in'},JSON.stringify(S));
  modal(h('div',{},
    h('h3',{},'สำรอง / นำเข้าข้อมูล'),
    h('p',{},'คัดลอกข้อความนี้เก็บไว้ หรือส่งให้เพื่อนเอาไปวางในช่องนี้บนเครื่องอื่น แล้วกด “นำเข้า”'),
    ta,
    h('div',{class:'acts'},
      h('button',{class:'btn',onclick:()=>copyText(ta.value,'คัดลอกข้อมูลสำรองแล้ว')},'คัดลอก'),
      h('button',{class:'btn primary',onclick:()=>{
        try{ const o=JSON.parse(ta.value); if(!o||!Array.isArray(o.members)||!Array.isArray(o.items)) throw 0;
          o.items.forEach(it=>{it.parts=it.parts||[];it.payers=it.payers||{};});
          S=o; save(); closeModal(); renderAll(); toast('นำเข้าข้อมูลแล้ว'); }
        catch(e){ toast('ข้อมูลไม่ถูกต้อง'); }
      }},'นำเข้า'),
      h('button',{class:'btn ghost',onclick:closeModal},'ปิด'))
  ));
}
function askReset(){
  modal(h('div',{},h('h3',{},'เริ่มใหม่ทั้งหมด?'),h('p',{},'ข้อมูลรายชื่อและรายการทั้งหมดจะถูกลบ (แนะนำให้สำรองข้อมูลก่อน)'),
    h('div',{class:'acts'},h('button',{class:'btn',onclick:closeModal},'ยกเลิก'),
      h('button',{class:'btn',onclick:()=>{S={title:'',members:S.members.map(m=>({...m})),items:[]};save();closeModal();renderAll();toast('ล้างรายการแล้ว เก็บรายชื่อไว้');}},'ล้างแค่รายการ'),
      h('button',{class:'btn primary',onclick:()=>{S=blank();save();closeModal();renderAll();}},'ลบทั้งหมด'))));
}

$('#title').addEventListener('input',e=>{S.title=e.target.value;save();});
S=load()||blank();
renderAll();
route();
window.__test={route,compute,ppPayload,ppTarget,get S(){return S;},set S(v){S=v;},sample,renderAll};
})();
</script>
